name = "hcdown-pinger"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fires every minute (Cloudflare Cron Triggers can't go finer than that);
# the scheduled handler in src/index.ts throttles actual checks to roughly
# a 90s cadence from there.
[triggers]
crons = ["*/1 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hcdown"
database_id = "55eda029-ecd1-4751-a204-8e2a023b76f0"
